name: Publish NuGet Packages to GitHub Packages

on:
  # Manuell auslösbar mit optionalem Versions-Suffix
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'NuGet Version Suffix (z.B. -local, -beta, leer lassen für keinen Suffix)'
        required: false
        default: '-local'

  # Automatisch bei Push auf den Feature-Branch
  push:
    branches:
      - 'feature/audio-distance-scale'
    paths:
      - 'sources/engine/Stride.Audio/**'
      - 'sources/engine/Stride.Engine/**'
      - 'sources/shared/SharedAssemblyInfo.cs'
      - 'sources/core/Stride.Core.AssemblyProcessor/**'
      - 'sources/targets/Stride.Core.targets'
      - '.github/workflows/publish-github-packages.yml'

env:
  CONFIGURATION: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout (full history for git versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Patch version in SharedAssemblyInfo.cs
        run: |
          $file = "sources/shared/SharedAssemblyInfo.cs"
          $suffix = "${{ github.event.inputs.version_suffix || '-local' }}"
          (Get-Content $file) `
            -replace 'PublicVersion = "4\.3\.0\.\d+"', 'PublicVersion = "4.3.0.2507"' `
            -replace 'NuGetVersionSuffix = "[^"]*"', "NuGetVersionSuffix = `"$suffix`"" |
            Set-Content $file
          Write-Host "Patched version to 4.3.0.2507$suffix"

      - name: Set up system LLVM/Clang and VCTargetsPath
        run: |
          # --- Clang/lld (replace bundled 32-bit deps/LLVM) ---
          $clang = (Get-Command clang -ErrorAction SilentlyContinue)?.Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang.exe" }
          $lld = $clang -replace 'clang\.exe$', 'lld.exe'
          Write-Host "Using clang: $clang"
          Write-Host "Using lld:   $lld"
          echo "STRIDE_CLANG=$clang" >> $env:GITHUB_ENV
          echo "STRIDE_LLD=$lld"     >> $env:GITHUB_ENV

          # --- VCTargetsPath (needed for WindowsDesktop.vcxproj under dotnet msbuild) ---
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = & $vswhere -latest -products * -property installationPath 2>$null }
          $vcVer   = Get-ChildItem "$vsPath\MSBuild\Microsoft\VC" -Name | Sort-Object -Descending | Select-Object -First 1
          $vcTargets = "$vsPath\MSBuild\Microsoft\VC\$vcVer\"
          Write-Host "VCTargetsPath: $vcTargets"
          echo "VC_TARGETS_PATH=$vcTargets" >> $env:GITHUB_ENV

      - name: Build Assembly Processor
        run: |
          dotnet build build/Stride.AssemblyProcessor.sln `
            -restore -m:1 -nr:false `
            -v:m -p:WarningLevel=0 `
            -p:Configuration=${{ env.CONFIGURATION }} `
            -p:StrideSkipUnitTests=true `
            -p:StrideSkipAutoPack=true

      - name: Restore NuGet packages
        run: |
          dotnet msbuild build/Stride.Runtime.sln `
            /t:Restore `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:StrideSkipUnitTests=true `
            /p:StrideSign=false `
            /p:StrideAssemblyProcessorDev=true `
            /p:StrideAssemblyProcessorFramework=net10.0 `
            /p:StrideNativeClangCommand="${{ env.STRIDE_CLANG }}" `
            /p:StrideNativeLldCommand="${{ env.STRIDE_LLD }}" `
            /p:VCTargetsPath="${{ env.VC_TARGETS_PATH }}" `
            /m

      - name: Build & Pack (Runtime packages)
        run: |
          dotnet msbuild build/Stride.Runtime.sln `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:StrideSkipAutoPack=false `
            /p:StrideSign=false `
            /p:StrideSkipUnitTests=true `
            /p:StrideAssemblyProcessorDev=true `
            /p:StrideAssemblyProcessorFramework=net10.0 `
            /p:StrideNativeClangCommand="${{ env.STRIDE_CLANG }}" `
            /p:StrideNativeLldCommand="${{ env.STRIDE_LLD }}" `
            /p:VCTargetsPath="${{ env.VC_TARGETS_PATH }}" `
            /m `
            /verbosity:minimal

      - name: List generated packages
        run: |
          $packages = Get-ChildItem "bin/packages/*.nupkg" -ErrorAction SilentlyContinue
          Write-Host "Found $($packages.Count) packages:"
          $packages | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source `
            --username ${{ github.actor }} `
            --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text `
            --name github `
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          # Alle Runtime-Pakete pushen, bereits vorhandene Versionen überspringen
          Get-ChildItem "bin/packages/*.nupkg" | ForEach-Object {
            Write-Host "Pushing: $($_.Name)"
            dotnet nuget push $_.FullName `
              --source github `
              --skip-duplicate
          }

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: bin/packages/*.nupkg
          retention-days: 30
